<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ruang Studi - kartu pratinjau tautan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Source of public/images/og/ruang-studi-share.png (1200x630). Rebuild command: see tasks/plan-seo-meta.md step 1. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #1266e4 0%, #0e4fb1 100%);
    font-family: "Nunito Sans", Arial, sans-serif;
  }
  .card { position: relative; width: 1200px; height: 630px; padding: 0 90px; }
  /* Content stays inside the central 1200x600 band, because some apps crop the top and bottom. */
  .label { position: absolute; top: 110px; left: 90px; font: 700 24px/1 "Poppins", Arial, sans-serif; letter-spacing: 6px; opacity: .85; }
  .title { white-space: nowrap; position: absolute; top: 205px; left: 90px; width: 1020px; margin: 0; font: 700 64px/1.15  "Poppins", Arial, sans-serif; }
  .subtitle { position: absolute; top: 330px; left: 90px; width: 900px; margin: 0; font: 400 30px/1.4 "Nunito Sans", Arial, sans-serif; opacity: .92; }
  .url { position: absolute; bottom: 90px; left: 90px; font: 600 28px/1 "Poppins", Arial, sans-serif; }
  .bar { position: absolute; left: 90px; top: 165px; width: 80px; height: 6px; border-radius: 3px; background: #fff; opacity: .9; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">RUANG STUDI</div>
    <div class="bar"></div>
    <h1 class="title">Belajar online, sertifikat resmi</h1>
    <p class="subtitle">Kursus, kuis, dan sertifikat dalam satu tempat</p>
    <div class="url">ruangstudi.id</div>
  </div>
</body>
</html>
