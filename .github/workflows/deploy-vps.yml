name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - development-ai

jobs:
  deploy:
    name: 🚀 Build & Deploy
    runs-on: [self-hosted, linux, nuc-lab]

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy langsung di VPS
        working-directory: /opt/services/lms2025
        run: |
          set -e

          echo "📥 Pulling latest code..."
          git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git development-ai

          echo "🏗️ Building & starting containers..."
          docker compose build app queue
          docker compose up -d --remove-orphans

          echo "⏳ Waiting for containers to be healthy..."
          sleep 10

          echo "🔧 Running post-deploy commands..."
          docker exec lms-app php artisan down --retry=5

          docker exec lms-app php artisan migrate --force
          docker exec lms-app php artisan optimize:clear
          docker exec lms-app php artisan storage:link
          docker exec lms-app php artisan config:cache
          docker exec lms-app php artisan route:cache
          docker exec lms-app php artisan view:cache
          docker exec lms-app php artisan queue:restart

          docker exec lms-app php artisan up

          echo "🔄 Restarting Nginx to apply config changes..."
          docker restart lms-nginx

          echo "✅ Deploy selesai!"

